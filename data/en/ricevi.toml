# Traduzioni inglesi dei testi di src/ricevi.rs (vedi src/lingua.rs).

# Finestra e barra degli strumenti
"Ricevi file dal telefono" = "Receive files from the phone"
"Si vede la memoria condivisa del telefono, la stessa che si vede col cavo." = "You see the phone's shared storage, the same you see with a cable."
