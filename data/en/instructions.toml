# Instructions for turning on Developer options and USB debugging, by brand
# family (SPECIFICATION §5.2), with the setting names of an English-language
# phone. Built into the program at compile time. Same families, `marche` and
# `verificata` as data/instructions.toml (a test in src/procedura.rs checks it).
# `marche`: words looked for (lowercase) in the manufacturer read over USB.
# The paths must be checked on a real phone of the family: the ones that are
# not verified are written from memory.

[[famiglia]]
nome = "Samsung"
marche = ["samsung"]
verificata = true
percorso_build = ["Settings", "About phone", "Software information"]
voce_build = "Build number"
percorso_debug = ["Settings", "Developer options"]
grigio = "Check that Auto Blocker is off (step 1): while it is on, it blocks USB debugging and Phonestra too."
# Seen on a Galaxy S26 (27 Sep 2026): Auto Blocker can be on straight from the
# factory and grays out USB debugging: it is turned off first.
[famiglia.prima]
percorso = ["Settings", "Security and privacy", "Auto Blocker"]
voce = "Auto Blocker"

[[famiglia]]
nome = "Xiaomi, Redmi, Poco"
marche = ["xiaomi", "redmi", "poco"]
verificata = false
percorso_build = ["Settings", "About phone"]
voce_build = "OS version (or MIUI version)"
percorso_debug = ["Settings", "Additional settings", "Developer options"]
grigio = "Insert a SIM card and sign in to your Xiaomi account (Settings › Xiaomi account), then try again."
# Extra step after “Allow”: without it, mouse and keyboard don't reach the apps.
sicurezza = "USB debugging (Security settings)"

[[famiglia]]
nome = "Google Pixel, Motorola"
marche = ["google", "motorola"]
verificata = false
percorso_build = ["Settings", "About phone"]
voce_build = "Build number"
percorso_debug = ["Settings", "System", "Developer options"]
grigio = "Turn off Advanced Protection (Settings › Security & privacy). If it is a work phone, your company may have blocked it."

[[famiglia]]
nome = "Oppo, OnePlus, Realme"
marche = ["oppo", "oneplus", "realme"]
verificata = false
percorso_build = ["Settings", "About device", "Version"]
voce_build = "Build number"
percorso_debug = ["Settings", "Additional settings", "Developer options"]

[[famiglia]]
nome = "Honor, Huawei"
marche = ["honor", "huawei"]
verificata = false
percorso_build = ["Settings", "About phone"]
voce_build = "Build number"
percorso_debug = ["Settings", "System & updates", "Developer options"]

# Unknown brand: the search in Settings works on every phone.
[[famiglia]]
nome = "Other phones"
marche = []
verificata = false
percorso_build = ["Settings", "search “build number”"]
voce_build = "Build number"
percorso_debug = ["Settings", "search “USB debugging”"]
grigio = "Something on the phone is blocking it: search for “Auto Blocker” or “Advanced Protection” in Settings and turn it off. If it is a work phone, your company may have blocked it."
