# Traduzioni inglesi dei testi di src/procedura.rs (vedi src/lingua.rs).
# «Aggiungi un telefono» e «Inizia a usare il telefono» stanno in prepara.toml.
# I nomi delle impostazioni del telefono sono quelli di un telefono in inglese.

# Passi a sinistra
"Collega il cavo USB" = "Connect the USB cable"
"Telefono e PC, con un cavo che trasmette dati" = "Phone and PC, with a cable that carries data"
"Attiva il Debug USB" = "Turn on USB debugging"
"Opzioni sviluppatore › Debug USB" = "Developer options › USB debugging"
"Consenti il collegamento" = "Allow the connection"
"Spunta «Consenti sempre da questo computer»" = "Check “Always allow from this computer”"
"Consenti la rete Wi-Fi" = "Allow the Wi-Fi network"
"Solo la prima volta per ogni rete" = "Only the first time on each network"
"Fatto" = "Done"
"Puoi scollegare il cavo" = "You can unplug the cable"

# Istruzioni al centro
"In attesa del telefono… me ne accorgo da solo." = "Waiting for the phone… I'll notice by myself."
"Collega il telefono al PC" = "Connect the phone to the PC"
"Usa un cavo USB che trasmette dati (alcuni cavi servono solo a ricaricare). Il telefono deve essere acceso e sbloccato.\n\nSe non succede niente: apri la tendina del telefono, tocca la notifica «USB» e scegli «Trasferimento file»; se il telefono chiede di consentire l'accesso ai dati, tocca «Consenti»." = "Use a USB cable that carries data (some cables only charge). The phone must be on and unlocked.\n\nIf nothing happens: open the phone's notification shade, tap the “USB” notification and choose “File transfer”; if the phone asks to allow access to its data, tap “Allow”."
"Sfoglia i passaggi con le frecce sotto il telefono disegnato. Quando il Debug USB è acceso me ne accorgo da solo e vado avanti." = "Browse the steps with the arrows under the drawn phone. When USB debugging is on I'll notice by myself and move on."
"Android non permette ai programmi di attivarlo: va fatto a mano, una volta sola. Istruzioni per {}." = "Android doesn't let programs turn it on: it has to be done by hand, once only. Instructions for {}."
"Scegli «Trasferimento file»" = "Choose “File transfer”"
"Il telefono è in «Solo ricarica»: così il PC non può parlargli. Apri la tendina del telefono, tocca la notifica «USB» e scegli «Trasferimento file». Se chiede di consentire l'accesso ai dati, tocca «Consenti»." = "The phone is set to “Charging only”: this way the PC can't talk to it. Open the phone's notification shade, tap the “USB” notification and choose “File transfer”. If it asks to allow access to its data, tap “Allow”."
"Sul telefono è comparsa una richiesta. Prima di toccare «Consenti» spunta la casella: senza, il cavo funziona ma il Wi-Fi no." = "A request has appeared on the phone. Before tapping “Allow”, check the box: without it the cable works but Wi-Fi doesn't."
"Apri <b>{}</b> e accendi <b>{}</b>.\n\nServono l'accesso all'account Xiaomi e internet; su alcune versioni anche una SIM inserita." = "Open <b>{}</b> and turn on <b>{}</b>.\n\nYou need to be signed in to your Xiaomi account and connected to the internet; on some versions a SIM card must be inserted too."
"Un passaggio in più per Xiaomi" = "One more step for Xiaomi"
"Sui telefoni Xiaomi il Debug USB normale non basta: senza questo interruttore le app si vedono ma non rispondono a mouse e tastiera." = "On Xiaomi phones the normal USB debugging is not enough: without this switch the apps are visible but don't respond to mouse and keyboard."
"Phonestra accende il Debug wireless. La prima volta su ogni rete il telefono chiede il permesso: tocca «Consenti»." = "Phonestra turns on Wireless debugging. The first time on each network the phone asks for permission: tap “Allow”."
"Provo il collegamento Wi-Fi…" = "Trying the Wi-Fi connection…"
"Cerco il telefono in rete e provo a collegarmi senza cavo." = "I'm looking for the phone on the network and trying to connect without the cable."
"Manca «Consenti sempre»" = "“Always allow” missing"
"Il telefono ha autorizzato il PC solo per questa volta, e così il Wi-Fi viene rifiutato. Scollega e ricollega il cavo; quando compare la richiesta, spunta «Consenti sempre da questo computer»." = "The phone authorized the PC for this time only, so Wi-Fi is refused. Unplug and replug the cable; when the request appears, check “Always allow from this computer”."
"Non trovo il telefono in rete" = "I can't find the phone on the network"
"Controlla che il telefono sia sulla stessa rete Wi-Fi del PC (non la rete ospiti). Continuo a provare da solo." = "Check that the phone is on the same Wi-Fi network as the PC (not the guest network). I'll keep trying by myself."
"Fatto!" = "Done!"
"Il {} è configurato e si collega via Wi-Fi: puoi scollegare il cavo." = "{} is set up and connects via Wi-Fi: you can unplug the cable."

# Istruzioni per il Debug USB (le parti fisse; i percorsi vengono da data/en/instructions.toml)
"1. Apri <b>{}</b> e, se è acceso, <b>spegnilo</b>: bloccherebbe il Debug USB.\n\n" = "1. Open <b>{}</b> and, if it is on, <b>turn it off</b>: it would block USB debugging.\n\n"
"{}{}. Apri <b>{}</b>.\n\n{}. Tocca <b>7 volte</b> «{}» e inserisci il PIN: compaiono le <b>Opzioni sviluppatore</b>.\n\n{}. Apri <b>{}</b> e accendi <b>Debug USB</b>.{}{}" = "{}{}. Open <b>{}</b>.\n\n{}. Tap “{}” <b>7 times</b> and enter your PIN: <b>Developer options</b> appear.\n\n{}. Open <b>{}</b> and turn on <b>USB debugging</b>.{}{}"
"\n\n<b>La voce è grigia?</b> {}" = "\n\n<b>Is the setting grayed out?</b> {}"
"\n\n<i>Percorso non ancora verificato per {}: se non trovi la voce, cercala con la ricerca delle Impostazioni.</i>" = "\n\n<i>Path not yet verified for {}: if you can't find the setting, look for it with the search in Settings.</i>"
"{} di {}" = "{} of {}"

