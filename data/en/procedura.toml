# Riquadro «Cosa vede il PC» (passo 1 fermo da 20 secondi)
"<b>Cosa vede il PC</b>\n{}" = "<b>What the PC sees</b>\n{}"
"Il PC vede il telefono, ma il telefono non offre né file né debug. Sbloccalo, apri la tendina, tocca la notifica «USB» e scegli «Trasferimento file».\n" = "The PC sees the phone, but the phone offers neither files nor debugging. Unlock it, open the notification shade, tap the “USB” notification and choose “File transfer”.\n"
"Il PC non riceve niente dal telefono. Prova, in quest'ordine:\n1. un altro cavo: molti servono solo a ricaricare;\n2. un'altra porta USB del PC, senza hub né prolunghe;\n3. su Samsung: Impostazioni › Sicurezza e privacy › Blocco automatico: spegnilo, comprese le «Restrizioni massime»;\n4. telefono acceso e sbloccato mentre colleghi il cavo.\n" = "The PC receives nothing from the phone. Try, in this order:\n1. another cable: many only charge;\n2. another USB port on the PC, without hubs or extension cables;\n3. on Samsung: Settings › Security and privacy › Auto Blocker: turn it off, including “Maximum restrictions”;\n4. phone on and unlocked while you connect the cable.\n"
"\nDispositivi USB collegati:\n" = "\nConnected USB devices:\n"
"(nessuno)" = "(none)"
