# Compilazione e prove di Phonestra a ogni push e pull request, senza telefono:
# cargo build, cargo test (le prove pure e il controllo dei manuali) e il
# controllo dei manuali da solo. Le prove col telefono (phonestra-prova) e
# l'AppImage (contenitore podman, make dist) restano manuali.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Pacchetti di sistema (GTK4, libadwaita, GStreamer, libudev, Python per i manuali)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libudev-dev libusb-1.0-0-dev \
            python3 python3-pygments python3-pil

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compila
        run: make all

      - name: Prove (comprende il controllo dei manuali)
        run: make test

      - name: Controllo dei manuali
        run: make docs-check
