<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>5B Finestra app ricerca</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&amp;display=swap">
<style>
body{margin:0;font-family:Manrope,sans-serif;background:#e6e7ea;color:#1b1c1e}
button{font-family:inherit;color:inherit}
</style>
</helmet>
<div style="width: 440px; height: 780px; box-sizing: border-box; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; background: #ffffff; position: relative; border: 1px solid #45484d">
  <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #2f7d5b; color: #ffffff">
    <span style="width: 34px; height: 34px; border-radius: 17px; background: #e8f3ee; color: #2f7d5b; font-weight: 800; display: flex; align-items: center; justify-content: center">A</span>
    <span style="font-size: 16px; font-weight: 800">Anna</span>
  </div>
  <div style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #eef1ef">
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
      <div style="display: flex; justify-content: {{m.side}}">
        <div style="max-width: 260px; padding: 9px 12px; border-radius: 12px; background: {{m.bg}}; font-size: 14px; line-height: 1.35">{{m.t}}</div>
      </div>
    </sc-for>
  </div>
  <div style="height: 60px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-top: 1px solid #dcdcdc">
    <label style="flex-grow: 1"><input aria-label="Scrivi un messaggio" placeholder="Scrivi un messaggio" style="width: 100%; box-sizing: border-box; height: 40px; padding: 0 14px; border: 1px solid #cfcfcf; border-radius: 20px; font: inherit; font-size: 14px"></label>
    <button aria-label="Invia" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #2f7d5b; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"></line><polyline points="14 6 20 12 14 18"></polyline></svg></button>
  </div>
  <div style="position: absolute; left: 8px; right: 8px; top: 8px; height: 44px; display: flex; align-items: center; gap: 2px; padding: 0 6px; border-radius: 12px; background: rgba(255,255,255,0.95); color: #1b1c1e; border: 1px solid #d6d7da; box-shadow: 0 6px 18px rgba(0,0,0,0.18)">
    <button aria-label="Indietro" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1b1c1e" stroke-width="2.4" stroke-linecap="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
    <span style="flex-grow: 1; font-size: 13px; font-weight: 600">Messaggi · Galaxy S23+</span>
    <button aria-label="Ruota" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1b1c1e" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"></path><polyline points="21 3 21 9 15 9"></polyline></svg></button>
    <button aria-label="Screenshot" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1b1c1e" stroke-width="2" stroke-linecap="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
    <button aria-label="Registra" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1b1c1e" stroke-width="2"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3.5" fill="#ff8a7a" stroke="none"></circle></svg></button>
    <button aria-label="Chiudi" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1b1c1e" stroke-width="3" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    const L = {side:'flex-start', bg:'#ffffff'}, R = {side:'flex-end', bg:'#d4ecdf'};
    return { msgs: [
      {...L, t:'Ciao! Hai visto il file che ti ho mandato?'},
      {...R, t:'Sì, lo sto guardando adesso dal PC.'},
      {...L, t:'Perfetto. Ci vediamo alle 8?'},
      {...R, t:'Va bene, a dopo.'}
    ]};
  }
}
</script>
</body>
</html>
