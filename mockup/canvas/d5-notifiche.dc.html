<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>5C Notifiche ricerca</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&amp;display=swap">
<style>
body{margin:0;font-family:Manrope,sans-serif;background:#e6e7ea;color:#1b1c1e}
button{font-family:inherit;color:inherit}
</style>
</helmet>
<div style="width: 440px; height: 560px; box-sizing: border-box; border-radius: 16px; background: #fbfbfa; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #45484d">
  <label style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; border-bottom: 1px solid #e3e3e0">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5a5d63" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16" y2="16"></line></svg>
    <input aria-label="Cerca nelle notifiche" placeholder="Cerca nelle notifiche" style="border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; flex-grow: 1">
  </label>
  <div style="display: flex; gap: 6px; padding: 10px 14px 4px">
    <button style="height: 28px; padding: 0 10px; border: 0; border-radius: 14px; background: #efefec; font-size: 12px">App</button>
    <button style="height: 28px; padding: 0 10px; border: 0; border-radius: 14px; background: #5b4bc4; color: #ffffff; font-size: 12px; font-weight: 600">Notifiche · 3</button>
    <button style="height: 28px; padding: 0 10px; border: 0; border-radius: 14px; background: #efefec; font-size: 12px">Telefoni</button>
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; padding: 6px 10px">
    <sc-for list="{{rows}}" as="n" hint-placeholder-count="2">
      <button style="display: flex; gap: 12px; align-items: flex-start; padding: 10px; border: 0; border-radius: 10px; background: transparent; text-align: left">
        <span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 9px; background: {{n.c}}; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center"><img src="{{n.s}}" alt="" style="width: 56%; height: 56%"></span>
        <span style="display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 12px; color: #5a5d63">{{n.phone}} · {{n.app}} · {{n.time}}</span>
          <span style="font-size: 14px; font-weight: 600">{{n.title}}: {{n.text}}</span>
        </span>
      </button>
    </sc-for>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 10px; border-radius: 10px; background: #ece9fb">
      <div style="display: flex; gap: 12px">
        <span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 9px; background: #6b4fa0; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center"><img src="/_blob/a7e9d08fb6f0f8740622843989f848f4" alt="" style="width: 56%; height: 56%"></span>
        <span style="display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 12px; color: #4a4d53">Telefono lavoro (non attivo) · Calendario · 10:02</span>
          <span style="font-size: 14px; font-weight: 600">Riunione di progetto spostata alle 11:30, sala 2.</span>
        </span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 12px; color: #4a4d53">Ctrl+↵ per passare</span>
        <button style="height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: #5b4bc4; color: #ffffff; font-size: 13px; font-weight: 600">Passa a Telefono lavoro</button>
      </div>
    </div>
  </div>
  <div style="display: flex; gap: 16px; padding: 10px 16px; border-top: 1px solid #e3e3e0; background: #f3f3f0; font-size: 12px; color: #5a5d63">
    <span>↑↓ scegli</span><span>↵ apri</span><span>Canc nascondi</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const IC = {'Messaggi':'/_blob/38349870bd47944da1153ca7c0e79969','Email':'/_blob/29e6439e734a1c49522531faba1e9b6c'};
    const ic = xs => xs.map(x => ({...x, s: IC[x.n || x.app]}));
    return { rows: ic([
      {phone:'Galaxy S23+', app:'Messaggi', time:'10:14', title:'Anna', text:'Ci vediamo alle 8?', c:'#2f7d5b', i:'M'},
      {phone:'Galaxy S23+', app:'Email', time:'09:50', title:'Fattura di settembre', text:'in allegato', c:'#2b5fa8', i:'E'}
    ])};
  }
}
</script>
</body>
</html>
