<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>1B Finestra app Adwaita</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Roboto:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:Inter,'Adwaita Sans',sans-serif;background:#deddda;color:rgba(0,0,0,0.8);-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;color:inherit}
</style>
</helmet>
<div style="width: 440px; height: 780px; box-sizing: border-box; padding: 22px 24px 26px; background: #deddda">
  <div style="width: 392px; height: 732px; box-sizing: border-box; border-radius: 12px; overflow: hidden; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.12), 0 8px 24px rgba(0,0,0,0.18); display: flex; flex-direction: column">
    <div style="height: 47px; flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding: 0 6px; background: #ffffff; box-shadow: 0 1px 0 rgba(0,0,0,0.08); position: relative; z-index: 1">
      <button aria-label="Indietro" style="width: 34px; height: 34px; border: 0; border-radius: 6px; background: transparent; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="10 3 5 8 10 13"></polyline></svg>
      </button>
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; line-height: 1.2">
        <span style="font-size: 14px; font-weight: 700">Messaggi</span>
        <span style="font-size: 12px; color: rgba(0,0,0,0.55)">Galaxy S23+</span>
      </div>
      <button aria-label="Screenshot" style="width: 34px; height: 34px; border: 0; border-radius: 6px; background: transparent; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M1.5 5h3l1.5-2h4l1.5 2h3v8.5h-13z"></path><circle cx="8" cy="9" r="2.3"></circle></svg>
      </button>
      <button aria-label="Altre azioni" style="width: 34px; height: 34px; border: 0; border-radius: 6px; background: transparent; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3.5" r="1.4"></circle><circle cx="8" cy="8" r="1.4"></circle><circle cx="8" cy="12.5" r="1.4"></circle></svg>
      </button>
      <button aria-label="Chiudi" style="width: 24px; height: 24px; margin: 0 5px 0 4px; border: 0; border-radius: 12px; background: rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center">
        <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="3" y1="3" x2="13" y2="13"></line><line x1="13" y1="3" x2="3" y2="13"></line></svg>
      </button>
      <div style="position: absolute; right: 44px; top: 42px; width: 188px; padding: 6px; box-sizing: border-box; border-radius: 12px; background: #ffffff; box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 6px 18px rgba(0,0,0,0.16); display: flex; flex-direction: column">
        <sc-for list="{{menu}}" as="m" hint-placeholder-count="4">
          <button style="display: flex; align-items: center; justify-content: space-between; height: 34px; padding: 0 10px; border: 0; border-radius: 6px; background: {{m.bg}}; font-size: 14px; text-align: left">{{m.t}}<span style="font-size: 12px; color: rgba(0,0,0,0.5)">{{m.k}}</span></button>
        </sc-for>
      </div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; font-family: Roboto, sans-serif; color: #1f1f1f">
      <div style="height: 60px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: #f8fafd">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="11 18 5 12 11 6"></polyline></svg>
        <span style="width: 36px; height: 36px; border-radius: 18px; background: #c2e7ff; color: #004a77; font-weight: 500; display: flex; align-items: center; justify-content: center">A</span>
        <span style="font-size: 17px">Anna</span>
      </div>
      <div style="flex-grow: 1; padding: 12px 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; background: #f8fafd">
        <div style="align-self: center; font-size: 12px; color: #5f6368; margin-bottom: 4px">Oggi 10:12</div>
        <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
          <div style="display: flex; justify-content: {{m.side}}">
            <div style="max-width: 250px; padding: 10px 14px; border-radius: 20px; background: {{m.bg}}; color: {{m.fg}}; font-size: 15px; line-height: 1.35">{{m.t}}</div>
          </div>
        </sc-for>
      </div>
      <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #f8fafd">
        <label style="flex-grow: 1"><input aria-label="Messaggio" placeholder="Messaggio" style="width: 100%; box-sizing: border-box; height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: #e9eef6; font-family: Roboto, sans-serif; font-size: 15px"></label>
        <button aria-label="Invia" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #0b57d0; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#ffffff"><path d="M3 20.5v-17L22 12z"></path></svg>
        </button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    const L = {side:'flex-start', bg:'#e9eef6', fg:'#1f1f1f'}, R = {side:'flex-end', bg:'#0b57d0', fg:'#ffffff'};
    return {
      menu: [
        {t:'Ruota', k:'Ctrl+R', bg:'transparent'},
        {t:'Registra', k:'Ctrl+Maiusc+R', bg:'transparent'},
        {t:'Copia screenshot', k:'', bg:'transparent'},
        {t:'Chiudi app', k:'Ctrl+W', bg:'transparent'}
      ],
      msgs: [
        {...L, t:'Ciao! Hai visto il file che ti ho mandato?'},
        {...R, t:'Sì, lo sto guardando adesso dal PC.'},
        {...L, t:'Perfetto. Ci vediamo alle 8?'},
        {...R, t:'Va bene, a dopo.'}
      ]
    };
  }
}
</script>
</body>
</html>
