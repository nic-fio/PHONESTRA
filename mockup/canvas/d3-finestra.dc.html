<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>3B Finestra app barra laterale</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Nunito Sans',sans-serif;background:#f7f5f1;color:#22201c}
button{font-family:inherit;color:inherit}
</style>
</helmet>
<div style="width: 440px; height: 780px; box-sizing: border-box; border: 1px solid #d8d2c8; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; background: #efebe4">
  <div style="height: 38px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid #ddd6cb">
    <span style="font-size: 14px; font-weight: 800">Messaggi</span>
    <span style="font-size: 12px; color: #5e5850; flex-grow: 1">su Galaxy S23+</span>
    <button aria-label="Chiudi" style="width: 26px; height: 26px; border: 0; border-radius: 13px; background: #e2dacd; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
  </div>
  <div style="flex-grow: 1; display: flex">
    <div style="width: 52px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 10px; border-right: 1px solid #ddd6cb">
      <button aria-label="Indietro" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: #b4532a; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
      <button aria-label="Ruota" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"></path><polyline points="21 3 21 9 15 9"></polyline></svg></button>
      <button aria-label="Screenshot" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
      <button aria-label="Registra" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3.5" fill="#b4532a" stroke="none"></circle></svg></button>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; background: #ffffff">
      <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: #2f7d5b; color: #ffffff">
        <span style="width: 34px; height: 34px; border-radius: 17px; background: #e8f3ee; color: #2f7d5b; font-weight: 800; display: flex; align-items: center; justify-content: center">A</span>
        <span style="font-size: 16px; font-weight: 800">Anna</span>
      </div>
      <div style="flex-grow: 1; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: #eef1ef">
        <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
          <div style="display: flex; justify-content: {{m.side}}">
            <div style="max-width: 230px; padding: 9px 12px; border-radius: 12px; background: {{m.bg}}; font-size: 14px; line-height: 1.35">{{m.t}}</div>
          </div>
        </sc-for>
      </div>
      <div style="height: 60px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-top: 1px solid #dcdcdc">
        <label style="flex-grow: 1"><input aria-label="Scrivi un messaggio" placeholder="Scrivi un messaggio" style="width: 100%; box-sizing: border-box; height: 40px; padding: 0 14px; border: 1px solid #cfcfcf; border-radius: 20px; font: inherit; font-size: 14px"></label>
        <button aria-label="Invia" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #2f7d5b; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"></line><polyline points="14 6 20 12 14 18"></polyline></svg></button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    const L = {side:'flex-start', bg:'#ffffff'}, R = {side:'flex-end', bg:'#d4ecdf'};
    return { msgs: [
      {...L, t:'Ciao! Hai visto il file che ti ho mandato?'},
      {...R, t:'Sì, lo sto guardando adesso dal PC.'},
      {...L, t:'Perfetto. Ci vediamo alle 8?'},
      {...R, t:'Va bene, a dopo.'}
    ]};
  }
}
</script>
</body>
</html>
