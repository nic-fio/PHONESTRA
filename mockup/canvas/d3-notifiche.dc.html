<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>3C Notifiche barra laterale</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Nunito Sans',sans-serif;background:#f7f5f1;color:#22201c}
button{font-family:inherit;color:inherit}
</style>
</helmet>
<div style="width: 440px; height: 560px; box-sizing: border-box; border: 1px solid #d8d2c8; border-radius: 12px; overflow: hidden; display: flex; background: #f7f5f1">
  <div style="width: 56px; flex-shrink: 0; background: #efebe4; border-right: 1px solid #ddd6cb; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 14px">
    <button aria-label="Tutte le app" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg></button>
    <button aria-label="Notifiche" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: #e2dacd; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg></button>
  </div>
  <div style="flex-grow: 1; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-size: 20px; font-weight: 800">Notifiche</h1>
    <div style="font-size: 12px; font-weight: 800; color: #5e5850; margin-top: 4px">GALAXY S23+</div>
    <sc-for list="{{active}}" as="n" hint-placeholder-count="2">
      <button style="display: flex; gap: 10px; text-align: left; padding: 10px; border: 0; border-radius: 12px; background: #ffffff; box-shadow: 0 1px 2px rgba(60,40,20,0.10)">
        <span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 9px; background: {{n.c}}; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center"><img src="{{n.s}}" alt="" style="width: 56%; height: 56%"></span>
        <span style="display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 12px; color: #5e5850">{{n.app}} · {{n.time}}</span>
          <span style="font-size: 14px; font-weight: 800">{{n.title}}</span>
          <span style="font-size: 13px">{{n.text}}</span>
        </span>
      </button>
    </sc-for>
    <div style="font-size: 12px; font-weight: 800; color: #5e5850; margin-top: 8px">TELEFONO LAVORO · NON ATTIVO</div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: #fbf1ea; border: 1px solid #e5c7b3">
      <div style="display: flex; gap: 10px">
        <span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 9px; background: #6b4fa0; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center"><img src="/_blob/a7e9d08fb6f0f8740622843989f848f4" alt="" style="width: 56%; height: 56%"></span>
        <span style="display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 12px; color: #5e5850">Calendario · 10:02</span>
          <span style="font-size: 14px; font-weight: 800">Riunione di progetto spostata</span>
          <span style="font-size: 13px">La riunione delle 11:00 è stata spostata alle 11:30, sala 2.</span>
        </span>
      </div>
      <button style="align-self: stretch; height: 36px; border: 0; border-radius: 18px; background: #b4532a; color: #ffffff; font-size: 14px; font-weight: 800">Passa a Telefono lavoro</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const IC = {'Messaggi':'/_blob/38349870bd47944da1153ca7c0e79969','Email':'/_blob/29e6439e734a1c49522531faba1e9b6c'};
    const ic = xs => xs.map(x => ({...x, s: IC[x.n || x.app]}));
    return { active: ic([
      {app:'Messaggi', time:'10:14', title:'Anna', text:'Perfetto. Ci vediamo alle 8?', c:'#2f7d5b', i:'M'},
      {app:'Email', time:'09:50', title:'Fattura di settembre', text:'In allegato la fattura relativa al mese di…', c:'#2b5fa8', i:'E'}
    ])};
  }
}
</script>
</body>
</html>
