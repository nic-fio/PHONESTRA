<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><title>Guida – Che telefono hai?</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Primo schermo della guida al primo collegamento (proposta, 27 set 2026).
     Prima del Debug USB Phonestra non sa che telefono è: lo chiede. Marca → serie →
     modello; «Non so il modello» anima dove leggerlo. Niente loghi di marchi.
     Scegliendo un modello si passa alla guida (guide-s26.html).
     ?cavo=samsung simula il cavo già collegato (marca letta dal codice USB). -->
<style>
  :root { --testo: rgba(0,0,0,0.82); --tenue: rgba(0,0,0,0.55); --accento: #3584e4;
    --scheda: rgba(255,255,255,0.62); --bordo: rgba(255,255,255,0.75); --oneui: #3e7bf6; }
  body { margin: 0; font-family: Inter, 'Adwaita Sans', sans-serif; color: var(--testo); background: #deddda; -webkit-font-smoothing: antialiased; }
  .scrivania { width: 1100px; height: 740px; display: flex; align-items: center; justify-content: center; }
  .finestra { width: 1040px; height: 680px; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
    background: linear-gradient(135deg, #cfe6fb 0%, #e3ebfb 45%, #dcd6f7 100%);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.12), 0 10px 30px rgba(0,0,0,0.2); }
  .barra { height: 47px; display: flex; align-items: center; padding: 0 8px 0 16px; gap: 8px; }
  .barra .titolo { font-weight: 700; font-size: 14px; flex: 1; }
  .pillola { display: flex; align-items: center; height: 30px; padding: 0 14px; border-radius: 15px;
    background: var(--scheda); box-shadow: inset 0 0 0 1px var(--bordo); font-size: 13px; font-weight: 600; cursor: pointer; }
  .chiudi { width: 24px; height: 24px; border-radius: 12px; background: rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: center; margin: 0 4px; }
  .corpo { flex: 1; display: flex; gap: 22px; padding: 6px 22px 22px; min-height: 0; }

  .pannello { flex: 1; display: flex; flex-direction: column; background: var(--scheda); border-radius: 18px;
    box-shadow: inset 0 0 0 1px var(--bordo), 0 1px 4px rgba(0,0,0,0.05); padding: 24px 26px 20px; min-width: 0; }
  .pannello h2 { margin: 0 0 6px; font-size: 24px; }
  .spiega { margin: 0 0 16px; font-size: 14px; color: var(--tenue); line-height: 1.5; }
  .briciole { display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; margin-bottom: 14px; }
  .briciole:empty { display: none; }
  .briciole a { color: var(--accento); text-decoration: none; cursor: pointer; }
  .briciole .sep { color: var(--tenue); }
  .cavo { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 12px; margin-bottom: 14px;
    background: rgba(38,162,105,0.12); color: #1a7a4c; font-size: 13px; font-weight: 600; }

  .marche { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .marca { height: 86px; border-radius: 14px; background: rgba(255,255,255,0.78); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.05);
    display: flex; align-items: center; gap: 12px; padding: 0 14px; cursor: pointer; transition: box-shadow .15s, transform .15s; }
  .marca:hover { box-shadow: inset 0 0 0 2px var(--accento), 0 3px 10px rgba(53,132,228,0.18); transform: translateY(-1px); }
  .marca svg { flex-shrink: 0; }
  .marca b { display: block; font-size: 14.5px; } .marca small { display: block; font-size: 11.5px; color: var(--tenue); margin-top: 2px; }
  .marca.no { opacity: .55; }
  .marca.visto { box-shadow: inset 0 0 0 2px #26a269, 0 3px 10px rgba(38,162,105,0.18); } .marca small.ok { color: #1a7a4c; font-weight: 600; }

  .serie { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .chip { height: 36px; padding: 0 16px; border-radius: 18px; display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    background: rgba(255,255,255,0.78); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.07); }
  .chip small { font-weight: 500; color: var(--tenue); font-size: 11.5px; }
  .chip.si { background: var(--accento); color: #fff; box-shadow: none; } .chip.si small { color: rgba(255,255,255,.8); }
  .modelli { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .modello { border-radius: 12px; padding: 10px 14px; background: rgba(255,255,255,0.78); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05); cursor: pointer; }
  .modello:hover, .modello.si { box-shadow: inset 0 0 0 2px var(--accento); }
  .modello b { font-size: 14px; display: block; } .modello small { font-size: 11.5px; color: var(--tenue); }
  .modello .ok { color: #1a7a4c; font-weight: 600; }
  .avviso { padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.78); font-size: 14px; line-height: 1.5; }
  .avviso b { display: block; font-size: 16px; margin-bottom: 4px; }

  .piede { margin-top: auto; display: flex; gap: 10px; align-items: center; padding-top: 14px; }
  .bott { height: 36px; padding: 0 18px; border-radius: 18px; border: none; font: 600 13.5px Inter, sans-serif; cursor: pointer;
    background: rgba(255,255,255,0.8); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); color: var(--testo); display: flex; align-items: center; gap: 7px; }
  .bott.primo { background: var(--accento); color: #fff; box-shadow: none; }
  .bott[disabled] { opacity: .45; cursor: default; }
  .nota { font-size: 12.5px; color: var(--tenue); flex: 1; }

  aside { width: 262px; display: flex; flex-direction: column; align-items: center; }
  .telefono { width: 250px; height: 530px; border-radius: 34px; padding: 7px; box-sizing: border-box; background: #1e1e22; box-shadow: 0 8px 22px rgba(0,0,0,0.25); }
  .schermo { width: 100%; height: 100%; border-radius: 27px; position: relative; overflow: hidden; background: #f2f2f4; color: #111; }
  .foro { position: absolute; top: 9px; left: 50%; width: 9px; height: 9px; margin-left: -4px; border-radius: 5px; background: #000; z-index: 9; }
  .stato { position: absolute; top: 0; left: 0; right: 0; height: 26px; display: flex; justify-content: space-between; align-items: center;
    padding: 0 18px; font-size: 10px; font-weight: 600; z-index: 8; }
  .vista { position: absolute; inset: 0; }
  .scorre { position: absolute; left: 0; right: 0; top: 0; transition: transform .9s cubic-bezier(.4,0,.2,1); }
  .didascalia { margin-top: 12px; font-size: 12.5px; color: var(--tenue); font-weight: 600; text-align: center; line-height: 1.4; }
  .grande { padding: 70px 18px 26px; font-size: 25px; }
  .indietro { padding: 34px 12px 10px; font-size: 15px; font-weight: 700; }
  .gruppo { background: #fff; border-radius: 18px; margin: 0 9px 9px; overflow: hidden; }
  .r { padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .r + .r { border-top: 1px solid #efeff1; }
  .r .ic { width: 26px; height: 26px; border-radius: 9px; flex-shrink: 0; }
  .r .tx b { display: block; font-size: 12.5px; font-weight: 600; } .r .tx small { display: block; font-size: 10px; color: #777; margin-top: 1px; }
  .nome { text-align: center; padding: 8px 0 14px; margin-bottom: 34px; } .nome b { font-size: 22px; font-weight: 600; display: block; } .nome small { font-size: 11px; color: #777; }
  .home { position: absolute; inset: 0; background: radial-gradient(circle at 20% 15%, #7fb8ff 0, transparent 45%), radial-gradient(circle at 85% 70%, #b07cff 0, transparent 50%), linear-gradient(160deg, #3d6fd8, #5a3fc0 60%, #1b8fb0); color: #fff; }
  .home .orologio { position: absolute; top: 90px; width: 100%; text-align: center; font-size: 46px; font-weight: 300; }
  .home .data { position: absolute; top: 148px; width: 100%; text-align: center; font-size: 12px; opacity: .9; }
  .dito { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 15px; z-index: 20; pointer-events: none;
    background: rgba(40,40,50,0.28); box-shadow: 0 0 0 2px rgba(255,255,255,0.9), 0 2px 6px rgba(0,0,0,0.3);
    left: 125px; top: 560px; opacity: 0; transition: left .7s cubic-bezier(.4,0,.2,1), top .7s cubic-bezier(.4,0,.2,1), opacity .3s, transform .12s; }
  .dito.si { opacity: 1; } .dito.giu { transform: scale(.78); }
  .onda { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 15px; border: 2px solid var(--oneui); z-index: 19;
    pointer-events: none; animation: onda .5s ease-out 1 forwards; }
  @keyframes onda { from { transform: scale(.6); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }
  .evid { box-shadow: inset 0 0 0 2px var(--oneui); border-radius: 12px; }
  .etichetta { position: absolute; z-index: 21; left: 50%; transform: translateX(-50%); background: var(--accento); color: #fff; font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 10px; white-space: nowrap; opacity: 0; transition: opacity .3s; }
  .etichetta.si { opacity: 1; }
</style></head><body>
<div class="scrivania"><div class="finestra">
  <div class="barra"><div class="titolo">Aggiungi un telefono</div><span class="pillola">Annulla</span>
    <div class="chiudi"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" stroke="#333" stroke-width="1.5" stroke-linecap="round"/></svg></div></div>
  <div class="corpo">
    <div class="pannello">
      <h2 id="titolo">Che telefono hai?</h2>
      <p class="spiega" id="spiega"></p>
      <div class="briciole" id="briciole"></div>
      <div id="scelte"></div>
      <div class="piede"><span class="nota" id="nota"></span>
        <button class="bott" id="nonso">Non so il modello</button>
        <button class="bott primo" id="inizia" disabled>Inizia</button></div>
    </div>
    <aside><div class="telefono"><div class="schermo" id="schermo"></div></div><div class="didascalia" id="didascalia"></div></aside>
  </div>
</div></div>
<script>
// ---- dati: marche, serie, modelli (poi verranno dall'indice dei moduli) -----------
const telefono = (c) => `<svg width="30" height="46" viewBox="0 0 30 46"><rect x="1.5" y="1.5" width="27" height="43" rx="6" fill="${c}" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/><rect x="4.5" y="5" width="21" height="36" rx="3" fill="rgba(255,255,255,.85)"/><circle cx="15" cy="8" r="1.3" fill="#333"/></svg>`;
const marche = [
  { nome: 'Samsung', sotto: 'Galaxy', c: '#4b6fd8' },
  { nome: 'Xiaomi', sotto: 'anche Redmi e Poco', c: '#f08a3c' },
  { nome: 'Google Pixel', sotto: '', c: '#5aa469' },
  { nome: 'Motorola', sotto: 'moto, edge', c: '#6a7fa0' },
  { nome: 'Oppo', sotto: '', c: '#3aa39a' },
  { nome: 'OnePlus', sotto: '', c: '#d0524a' },
  { nome: 'Realme', sotto: '', c: '#d8b13a' },
  { nome: 'Honor', sotto: 'anche Huawei', c: '#7a6ad0' },
  { nome: 'Nothing', sotto: '', c: '#8a8a8a' },
  { nome: 'iPhone', sotto: 'Apple', c: '#b9bcc2', no: true },
  { nome: 'Un altro', sotto: 'o non lo so', c: '#c9ccd3', altro: true },
];
// «provata»: guida verificata su quel telefono; altrimenti le istruzioni della sua versione di One UI.
const samsung = {
  'Galaxy S': [
    { m: 'Galaxy S26', a: '2026', ui: '8.5', guida: 'guide-s26.html' }, { m: 'Galaxy S26+', a: '2026', ui: '8.5' }, { m: 'Galaxy S26 Ultra', a: '2026', ui: '8.5' },
    { m: 'Galaxy S25', a: '2025', ui: '8' }, { m: 'Galaxy S25+', a: '2025', ui: '8' }, { m: 'Galaxy S25 Ultra', a: '2025', ui: '8' },
    { m: 'Galaxy S24', a: '2024', ui: '8' }, { m: 'Galaxy S23+', a: '2023', ui: '8', provata: true }, { m: 'S23, S22, S21 o prima', a: '2021–23', ui: '6–8' },
  ],
  'Galaxy Z': [ { m: 'Galaxy Z Fold7', a: '2025', ui: '8' }, { m: 'Galaxy Z Flip7', a: '2025', ui: '8' }, { m: 'Fold o Flip precedenti', a: '', ui: '6–8' } ],
  'Galaxy A': [ { m: 'Galaxy A57', a: '2026', ui: '8.5' }, { m: 'Galaxy A56', a: '2025', ui: '8' }, { m: 'Galaxy A36', a: '2025', ui: '8' },
    { m: 'Galaxy A26 o A16', a: '2025', ui: '8' }, { m: 'Altri Galaxy A', a: '', ui: '6–8' } ],
  'Altri Galaxy': [ { m: 'Galaxy M, F o XCover', a: '', ui: '6–8' } ],
};

// ---- interfaccia ----------------------------------------------------------------------
const $ = id => document.getElementById(id);
const stato = { marca: null, serie: null, modello: null };
const parametri = new URLSearchParams(location.search);

function disegna() {
  const { marca, serie, modello } = stato;
  const visto = parametri.get('cavo') === 'samsung' ? 'Samsung' : null;
  $('briciole').innerHTML = marca ? `<a onclick="indietro(0)">Marche</a><span class="sep">›</span>${serie ? `<a onclick="indietro(1)">${marca}</a><span class="sep">›</span><span>${serie}</span>` : `<span>${marca}</span>`}` : '';
  $('inizia').disabled = !modello;
  $('nonso').style.display = marca && !marca.no ? '' : 'none';
  if (!marca) {
    $('titolo').textContent = 'Che telefono hai?';
    $('spiega').textContent = visto ? 'Sul cavo vedo un telefono ' + visto + ': toccalo e scegli il modello. Ti mostro esattamente dove toccare.'
      : 'Ti mostro esattamente dove toccare, sul tuo telefono. Il cavo non serve ancora.';
    $('scelte').innerHTML = `<div class="marche">${marche.map(m => `<div class="marca ${m.no ? 'no' : ''} ${m.nome === visto ? 'visto' : ''}" onclick="scegliMarca('${m.nome}')">${telefono(m.c)}<div><b>${m.nome}</b>${m.nome === visto ? '<small class="ok">● sul cavo</small>' : m.sotto ? `<small>${m.sotto}</small>` : ''}</div></div>`).join('')}</div>`;
    $('nota').textContent = 'Il nome è sul retro del telefono o sulla confezione.';
    return;
  }
  if (marca === 'iPhone') {
    $('titolo').textContent = 'iPhone';
    $('spiega').textContent = '';
    $('scelte').innerHTML = '<div class="avviso"><b>Phonestra funziona solo con i telefoni Android.</b>Gli iPhone non permettono ai programmi del PC di mostrarne lo schermo e le app. Se hai anche un telefono Android, torna indietro e sceglilo.</div>';
    $('nota').textContent = ''; return;
  }
  if (marca !== 'Samsung') {
    $('titolo').textContent = marca;
    $('spiega').textContent = 'In questa prova c\'è solo il modulo Samsung. Qui comparirebbero le serie e i modelli di questa marca.';
    $('scelte').innerHTML = ''; $('nota').textContent = ''; return;
  }
  $('titolo').textContent = 'Quale Galaxy?';
  $('spiega').textContent = 'Il nome completo è in Impostazioni › Informazioni sul telefono, in alto.';
  $('scelte').innerHTML = `<div class="serie">${Object.keys(samsung).map(s => `<div class="chip ${s === serie ? 'si' : ''}" onclick="scegliSerie('${s}')">${s}<small>${s === 'Galaxy Z' ? 'pieghevoli' : ''}</small></div>`).join('')}</div>
    ${serie ? `<div class="modelli">${samsung[serie].map((x, i) => `<div class="modello ${modello === x ? 'si' : ''}" onclick="scegliModello(${i})"><b>${x.m}</b>
      <small>${x.a ? x.a + ' · ' : ''}${x.provata ? '<span class="ok">✓ guida provata</span>' : 'One UI ' + x.ui}</small></div>`).join('')}</div>` : ''}`;
  $('nota').innerHTML = modello ? (modello.provata ? 'Guida provata su questo telefono.' : `Guida per One UI ${modello.ui}: i menu sono gli stessi dei Galaxy con questa versione.`) : '';
}
function scegliMarca(m) { stato.marca = m; stato.serie = m === 'Samsung' ? 'Galaxy S' : null; stato.modello = null; disegna(); }
function scegliSerie(s) { stato.serie = s; stato.modello = null; disegna(); }
function scegliModello(i) { stato.modello = samsung[stato.serie][i]; disegna(); }
function indietro(livello) { if (livello === 0) stato.marca = null; stato.serie = livello === 0 ? null : stato.serie && stato.marca === 'Samsung' ? 'Galaxy S' : null; stato.modello = null; disegna(); }
$('inizia').onclick = () => { location.href = stato.modello.guida || 'guide-s26.html'; };

// ---- animazione «Dove leggo il modello?» (finita) --------------------------------------
const schermo = $('schermo');
const colori = ['#4c8df6','#35b37e','#f5a524','#e5534b','#8e6cf0','#2bb3c0','#f06292','#7d8591'];
const riga = (o, i) => `<div class="r" data-id="${o.id || ''}"><span class="ic" style="background:${colori[i % colori.length]}"></span><span class="tx"><b>${o.t}</b>${o.s ? `<small>${o.s}</small>` : ''}</span></div>`;
const gruppi = gs => gs.map(g => `<div class="gruppo">${g.map(riga).join('')}</div>`).join('');
const barra = scuro => `<div class="stato" style="color:${scuro ? '#fff' : '#111;background:#f2f2f4'}"><span>10:24</span><span>▾ ▮ 78%</span></div>`;
const attendi = ms => new Promise(r => setTimeout(r, ms));
let giro = 0;
function nuovo(html, scuro) { schermo.innerHTML = `<div class="foro"></div><div class="vista">${html}</div>${barra(scuro)}<div class="dito"></div>`; }
const dito = () => schermo.querySelector('.dito');
function vai(x, y) { dito().style.left = x + 'px'; dito().style.top = y + 'px'; }
function centro(id) { const a = schermo.querySelector(`[data-id="${id}"]`).getBoundingClientRect(), s = schermo.getBoundingClientRect(); return [Math.min(a.left - s.left + a.width / 2, 190), a.top - s.top + a.height / 2]; }
async function tocca(id) {
  const [x, y] = centro(id), el = schermo.querySelector(`[data-id="${id}"]`); vai(x, y); await attendi(800);
  el.classList.add('evid'); dito().classList.add('giu');
  const o = document.createElement('div'); o.className = 'onda'; o.style.left = x + 'px'; o.style.top = y + 'px'; schermo.appendChild(o);
  await attendi(140); dito().classList.remove('giu'); await attendi(560);
}
function riposo() {
  nuovo('<div class="home"><div class="orologio">10:24</div><div class="data">sab 27 settembre</div></div>', true);
  $('didascalia').textContent = '';
}
async function doveModello() {
  const mio = ++giro, vivo = () => mio === giro;
  $('didascalia').textContent = 'Dove leggo il nome del telefono';
  nuovo(`<div class="scorre">${'<div class="grande">Impostazioni</div>'}${gruppi([[{t:'Connessioni', s:'Wi-Fi · Bluetooth'}, {t:'Dispositivi connessi'}],
    [{t:'Suoni e vibrazione'}, {t:'Notifiche'}, {t:'Schermo'}, {t:'Batteria'}], [{t:'Sicurezza e privacy'}, {t:'Posizione'}],
    [{t:'Account e backup'}, {t:'Google'}, {t:'Funzioni avanzate'}], [{t:'Gestione generale'}, {t:'Aggiornamento software'}, {t:'Informazioni sul telefono', s:'Stato · Informazioni legali', id:'info'}]])}</div>`);
  await attendi(400); dito().classList.add('si'); await attendi(300);
  if (!vivo()) return;
  schermo.querySelector('.scorre').style.transform = 'translateY(-470px)'; await attendi(1100);
  if (!vivo()) return;
  await tocca('info'); if (!vivo()) return;
  nuovo(`<div class="scorre"><div class="indietro">‹ Informazioni sul telefono</div><div class="nome" data-id="nome"><b>Galaxy S26</b><small>SM-S942B</small></div>${gruppi([[{t:'Stato'}, {t:'Informazioni legali'}, {t:'Informazioni sul software'}]])}</div>
    <div class="etichetta" style="top:140px">Questo è il tuo modello</div>`);
  await attendi(500); if (!vivo()) return;
  schermo.querySelector('[data-id=nome]').classList.add('evid'); schermo.querySelector('.etichetta').classList.add('si');
  $('didascalia').innerHTML = 'Il nome è in alto: scegli quello.<br><a href="#" onclick="doveModello();return false" style="color:var(--accento)">Rivedi</a>';
}
$('nonso').onclick = doveModello;
riposo();
if (parametri.get('marca')) scegliMarca(parametri.get('marca'));
disegna();
</script>
</body></html>
